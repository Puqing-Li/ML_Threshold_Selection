[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-threshold-selection"
version = "1.3.2"
description = "Expert-guided threshold selection for XRCT particle analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Puqing Li", email = "puqingli1125@gmail.com"},
]
maintainers = [
    {name = "Puqing Li", email = "puqingli1125@gmail.com"},
]
keywords = ["xrct", "particle analysis", "machine learning", "threshold selection", "image processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.19.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "lightgbm>=3.2.0",
    "joblib>=1.0.0",
    "openpyxl>=3.0.0",
    "xlrd>=2.0.1",
    "tifffile>=2022.8.12",
]

[project.optional-dependencies]
dev = [
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "nbsphinx>=0.8",
    "myst-parser>=0.15",
]

[project.urls]
Homepage = "https://github.com/Puqing-Li/ML_Threshold_Selection"
Documentation = "https://github.com/Puqing-Li/ML_Threshold_Selection/tree/main/docs"
Repository = "https://github.com/Puqing-Li/ML_Threshold_Selection.git"
"Bug Tracker" = "https://github.com/Puqing-Li/ML_Threshold_Selection/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "matplotlib.*",
    "seaborn.*",
    "tkinter.*",
]
ignore_missing_imports = true
